services:
  openflux:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENFLUX_UPSTREAM_REPO: ${OPENFLUX_UPSTREAM_REPO:-https://github.com/p1neappleXpress/OpenFlux.git}
    image: openflux-deploy:local
    container_name: openflux-deploy
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "${OPENFLUX_PORT:-8088}:${OPENFLUX_PORT:-8088}"
    environment:
      OPENFLUX_ADMIN_USER: ${OPENFLUX_ADMIN_USER:-admin}
      OPENFLUX_ADMIN_PASSWORD: ${OPENFLUX_ADMIN_PASSWORD:?set in .env}
      OPENFLUX_NODE_TOKEN: ${OPENFLUX_NODE_TOKEN:?set in .env}
      OPENFLUX_LISTEN: :${OPENFLUX_PORT:-8088}
      OPENFLUX_CONFIG: /etc/openflux-deploy/config.json
      OPENFLUX_NODES: /etc/openflux-deploy/nodes.json
      OPENFLUX_TLS_CERT: /etc/openflux-deploy/tls/cert.pem
      OPENFLUX_TLS_KEY: /etc/openflux-deploy/tls/key.pem
      OPENFLUX_BINARY: /var/lib/openflux-deploy/bin/openflux
      OPENFLUX_VERSION_FILE: /var/lib/openflux-deploy/upstream-version
      OPENFLUX_UPDATE_SCRIPT: /usr/local/lib/openflux-deploy/update.sh
      OPENFLUX_UPSTREAM_REPO: ${OPENFLUX_UPSTREAM_REPO:-https://github.com/p1neappleXpress/OpenFlux.git}
      OPENFLUX_AUTO_UPDATE_INTERVAL: 24h
      OPENFLUX_AUTO_UPDATE_DELAY: 20m
    volumes:
      - /etc/openflux-deploy:/etc/openflux-deploy
      - /var/lib/openflux-deploy:/var/lib/openflux-deploy
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1:${OPENFLUX_PORT:-8088}/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

name: Deploy fork CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test OpenFlux
        run: go test ./...
      - name: Test panel
        working-directory: deploy/panel
        run: go test ./...
      - name: Build Linux binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/openflux .
          cd deploy/panel
          CGO_ENABLED=0 go build -trimpath -o /tmp/openflux-panel .
          /tmp/openflux-panel --version
      - name: Validate installer scripts
        run: |
          bash -n deploy.sh
          bash -n deploy/update.sh
          bash -n deploy/panel-update.sh
          bash -n deploy/entrypoint.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Docker context
        run: |
          mkdir -p /tmp/openflux-docker/source
          cp -a . /tmp/openflux-docker/source/
          cp deploy/Dockerfile deploy/docker-compose.yml deploy/entrypoint.sh deploy/update.sh deploy/panel-update.sh /tmp/openflux-docker/
      - name: Build image
        working-directory: /tmp/openflux-docker
        run: docker build -t openflux-deploy:ci .
